  <a class="skip-link" href="#app">Перейти к содержимому</a>

  <main id="app">
    <section class="screen is-active" id="screen-home">
      <header class="home-head">
        <h1 class="home-title" tabindex="-1">Геометрическая прогрессия</h1>
        <div class="home-tools">
          <button type="button" class="btn" id="btn-formulas"><svg class="icon" aria-hidden="true"><use href="#i-book-open"></use></svg><span>Формулы</span></button>
          <button type="button" class="btn" id="btn-fullscreen"><svg class="icon" aria-hidden="true"><use href="#i-maximize"></use></svg><span>На весь экран</span></button>
        </div>
      </header>

      <div class="screen-body home-body">
        <div class="scheme">
          <div class="scheme-graphic" id="home-scheme" aria-hidden="true"></div>
          <p class="scheme-text">Каждый следующий член — предыдущий, умноженный на q. Здесь q = 3.</p>
        </div>

        <section class="home-section home-section--stages">
          <h2 class="caption">Урок</h2>
          <div class="stage-grid">
            <button type="button" class="card-button stage-card" data-mode="theory">
              <span class="stage-num">1</span>
              <svg class="icon icon--l stage-icon" aria-hidden="true"><use href="#i-brain"></use></svg>
              <span class="stage-fact" data-fact="theory"></span>
              <span class="stage-name">Опрос по теории</span>
              <svg class="icon icon--s stage-link" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            </button>
            <button type="button" class="card-button stage-card" data-mode="pairs">
              <span class="stage-num">2</span>
              <svg class="icon icon--l stage-icon" aria-hidden="true"><use href="#i-users"></use></svg>
              <span class="stage-fact" data-fact="pairs"></span>
              <span class="stage-name">Парная работа</span>
              <svg class="icon icon--s stage-link" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            </button>
            <button type="button" class="card-button stage-card" data-mode="groups">
              <span class="stage-num">3</span>
              <svg class="icon icon--l stage-icon" aria-hidden="true"><use href="#i-puzzle"></use></svg>
              <span class="stage-fact" data-fact="groups"></span>
              <span class="stage-name">Групповая работа</span>
              <svg class="icon icon--s stage-link" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
            </button>
            <button type="button" class="card-button stage-card" data-mode="test">
              <span class="stage-num">4</span>
              <svg class="icon icon--l stage-icon" aria-hidden="true"><use href="#i-notebook-pen"></use></svg>
              <span class="stage-fact" data-fact="test"></span>
              <span class="stage-name">Самостоя&shy;тельная работа</span>
            </button>
          </div>
        </section>

        <section class="home-section">
          <h2 class="caption">Свободная практика</h2>
          <button type="button" class="card-button practice-card" data-mode="trainer">
            <svg class="icon icon--l practice-icon" aria-hidden="true"><use href="#i-dumbbell"></use></svg>
            <span class="practice-text">
              <span class="stage-name">Тренажёр</span>
              <span class="stage-desc">7 уровней: от простых задач к задачам из жизни</span>
            </span>
            <span class="practice-progress is-hidden" id="home-progress"></span>
            <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
          </button>
        </section>
      </div>
    </section>

    <section class="screen" id="screen-theory"></section>
    <section class="screen" id="screen-pairs"></section>
    <section class="screen" id="screen-groups"></section>
    <section class="screen" id="screen-test"></section>
    <section class="screen" id="screen-trainer"></section>
  </main>
